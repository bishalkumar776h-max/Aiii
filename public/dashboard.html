<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | AI Premium Suite</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body data-theme="dark">
    <div class="app-shell">
        <aside class="app-sidebar" id="appSidebar">
            <div class="brand"><i class="fas fa-robot"></i><span>AI Premium</span></div>
            <a class="side-link active" href="/dashboard.html" data-view="overview"><i class="fas fa-gauge"></i> Overview</a>
            <button class="side-link" data-view="chats"><i class="fas fa-comments"></i> Chat History</button>
            <button class="side-link" data-view="gallery"><i class="fas fa-images"></i> My Images</button>
            <button class="side-link" data-view="settings"><i class="fas fa-gear"></i> Settings</button>
            <a class="side-link" href="/index.html"><i class="fas fa-house"></i> Back to Site</a>
            <div id="sidebarAdminLink"></div>
            <div style="margin-top:auto;">
                <button class="side-link" id="sidebarLogoutBtn"><i class="fas fa-right-from-bracket"></i> Log Out</button>
            </div>
        </aside>

        <main class="app-main">
            <div class="app-topbar">
                <div>
                    <button class="menu-toggle" id="sidebarToggle" style="display:none;"><i class="fas fa-bars"></i></button>
                    <h1 id="welcomeTitle">Welcome back</h1>
                    <p>Here's a snapshot of your AI Premium Suite activity.</p>
                </div>
                <div id="navAuthSlot"></div>
            </div>

            <!-- Overview -->
            <div id="view-overview">
                <div class="stat-cards">
                    <div class="stat-card">
                        <div class="stat-card-top">
                            <span class="stat-label">Messages Sent</span>
                            <div class="stat-icon" style="background:#6366f1;"><i class="fas fa-comment"></i></div>
                        </div>
                        <div class="stat-value" id="statMessages">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-card-top">
                            <span class="stat-label">Images Generated</span>
                            <div class="stat-icon" style="background:#ec4899;"><i class="fas fa-image"></i></div>
                        </div>
                        <div class="stat-value" id="statImages">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-card-top">
                            <span class="stat-label">Images Resized</span>
                            <div class="stat-icon" style="background:#10b981;"><i class="fas fa-expand"></i></div>
                        </div>
                        <div class="stat-value" id="statResized">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-card-top">
                            <span class="stat-label">Member Since</span>
                            <div class="stat-icon" style="background:#f59e0b;"><i class="fas fa-calendar"></i></div>
                        </div>
                        <div class="stat-value" id="statMemberSince" style="font-size:1.1rem;">-</div>
                    </div>
                </div>

                <div class="panel">
                    <div class="panel-header"><h3>Recent Images</h3><button class="side-link" style="width:auto;color:var(--primary);" data-view="gallery">View all →</button></div>
                    <div class="gallery-grid" id="recentGallery"><div class="empty-state"><i class="fas fa-spinner fa-spin"></i></div></div>
                </div>
            </div>

            <!-- Chat History -->
            <div id="view-chats" style="display:none;">
                <div class="panel">
                    <div class="panel-header"><h3>Your Chat Sessions</h3></div>
                    <div class="session-list" id="sessionList"><div class="empty-state"><i class="fas fa-spinner fa-spin"></i></div></div>
                </div>
            </div>

            <!-- Gallery -->
            <div id="view-gallery" style="display:none;">
                <div class="panel">
                    <div class="panel-header"><h3>My Generated Images</h3></div>
                    <div class="gallery-grid" id="fullGallery"><div class="empty-state"><i class="fas fa-spinner fa-spin"></i></div></div>
                </div>
            </div>

            <!-- Settings -->
            <div id="view-settings" style="display:none;">
                <div class="panel" style="max-width:480px;">
                    <div class="panel-header"><h3>Profile</h3></div>
                    <form class="auth-form" id="profileForm">
                        <div class="form-group"><label>Username</label><input type="text" id="settingsUsername"></div>
                        <div class="form-group"><label>Email</label><input type="email" id="settingsEmail" disabled></div>
                        <button type="submit" class="auth-submit-btn">Save Changes</button>
                    </form>
                </div>
                <div class="panel" style="max-width:480px;">
                    <div class="panel-header"><h3>Change Password</h3></div>
                    <div class="auth-error" id="passwordError"></div>
                    <form class="auth-form" id="passwordForm">
                        <div class="form-group"><label>Current Password</label><input type="password" id="currentPassword" required></div>
                        <div class="form-group"><label>New Password</label><input type="password" id="newPassword" minlength="8" required></div>
                        <button type="submit" class="auth-submit-btn">Update Password</button>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/dashboard.js"></script>
</body>
</html>
